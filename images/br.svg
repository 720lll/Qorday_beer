<svg width="200" height="90" viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0e10"></stop>
      <stop offset="100%" stop-color="#1c1c22"></stop>
    </linearGradient>

    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd77a"></stop>
      <stop offset="100%" stop-color="#d08f00"></stop>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="90" rx="12" fill="url(#bg)"></rect>

  <!-- кружка (сдвинута левее) -->
  <g filter="url(#softGlow)" transform="translate(-8,0)">
    <rect x="18" y="24" width="28" height="42" rx="6" fill="#f5f5f5"></rect>
    <rect x="46" y="32" width="7" height="26" rx="3" fill="none" stroke="#f5f5f5" stroke-width="2"></rect>

    <rect x="20" y="30" width="24" height="30" rx="4" fill="url(#beer)"></rect>

    <circle cx="24" cy="30" r="4" fill="#fff"></circle>
    <circle cx="32" cy="28" r="5" fill="#fff"></circle>
    <circle cx="40" cy="30" r="4" fill="#fff"></circle>
  </g>

  <!-- ТЕКСТ (тоже слегка левее) -->
  <text x="52" y="50" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#f2f2f2" letter-spacing="1.5">
    QORDAY_BEER
  </text>

  <text x="52" y="65" font-family="Arial, sans-serif" font-size="8" fill="#9a9a9a" letter-spacing="1">
    craft beer brand
  </text>

</svg>